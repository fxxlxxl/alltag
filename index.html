<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alltag">
<title>Alltag</title>
<style>
:root{--bg:#eef1f6;--pn:#fff;--tx:#1b2340;--mu:#6a7391;--bd:#dde2ee;--ac:#2d5bff;--ac2:#e4eaff;--hl:#ffc933;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--pn:#191d33;--tx:#edeffa;--mu:#98a1c4;--bd:#2a3050;--ac:#7c9bff;--ac2:#232a52;--hl:#ffd25a}}
:root[data-theme="dark"]{--bg:#0f1220;--pn:#191d33;--tx:#edeffa;--mu:#98a1c4;--bd:#2a3050;--ac:#7c9bff;--ac2:#232a52;--hl:#ffd25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 18px 110px}
h1{font:700 32px/1.1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;margin:10px 0 4px;letter-spacing:-.01em}
h2{font:600 17px ui-rounded,"SF Pro Rounded",system-ui,sans-serif;margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 16px}
.pn{background:var(--pn);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.hero{border-radius:34px;text-align:center;padding:18px 16px 14px}
.hero svg{width:170px;height:170px}
.rg{fill:none;stroke:var(--bd);stroke-width:10}
.rp{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .5s}
.rt{fill:var(--tx);font:700 26px ui-rounded,system-ui,sans-serif}
button{font:inherit;border:0;border-radius:14px;background:var(--ac);color:#fff;padding:10px 16px;font-weight:600}
button.g{background:var(--ac2);color:var(--ac)}
input,textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:2px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:14px;padding:10px 12px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it>span{flex:1}
.done>span{text-decoration:line-through;color:var(--mu)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;padding:0;flex:none;color:#fff;font-size:15px;line-height:1}
.done .chk{background:var(--ac)}
.x{background:none;color:var(--mu);padding:4px 8px;font-size:20px}
.star{color:var(--hl)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pn);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:4px 0;font-weight:500}
nav button b{display:block;height:26px;margin-bottom:2px}
nav button svg{display:block;margin:0 auto;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
.mood{justify-content:space-between}
.mood button{font-size:28px;background:none;color:var(--tx);padding:6px 10px;border-radius:999px;opacity:.4}
.mood button.on{opacity:1;background:var(--ac2);color:var(--ac)}
.fa{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;display:block}
.sp .fa{width:24px;height:24px}
a.bt{display:inline-block;text-decoration:none;background:var(--ac);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600}
a.bt.r{background:#e5484d}
.fl{width:17px;height:17px;fill:none;stroke:var(--hl);stroke-width:1.7;stroke-linejoin:round;vertical-align:-3px;margin-right:3px}
#lk{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:9;align-items:center;justify-content:center}
.dots{display:flex;gap:5px;margin:8px 0 0 40px}
.dots u{width:18px;height:18px;border-radius:50%;background:var(--bd)}
.dots u.on{background:var(--hl)}
.hm{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,18px);grid-auto-flow:column;gap:4px;margin-top:8px}
.hm u{border-radius:5px;background:var(--bd)}
.hm u.l1{background:var(--ac);opacity:.35}
.hm u.l2{background:var(--ac);opacity:.65}
.hm u.l3{background:var(--ac)}
.hm u.f{background:none;border:1px dashed var(--bd)}
.big{font:700 38px ui-rounded,system-ui,sans-serif;text-align:center}
small{font-size:15px;color:var(--mu);font-weight:500}
.sp{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{background:var(--pn);color:var(--tx);border:2px solid var(--bd);border-radius:999px;padding:6px 12px;font-weight:500}
.chips button.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.wk{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:8px}
.wk div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.wk i{display:block;background:var(--ac);border-radius:8px 8px 4px 4px;min-height:4px;margin-bottom:4px}
.bk{width:90px;height:90px;border-radius:50%;background:var(--ac2);border:3px solid var(--ac);margin:14px auto 6px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ac);transition:transform 4s ease-in-out;text-align:center}
.late{color:#e5484d}
.fo{border-color:var(--hl);font-weight:600}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.pb i{display:block;height:100%;background:var(--ac)}
.pb.o i{background:#e5484d}
#ts{display:none;position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:16px;padding:12px 14px;text-align:center;z-index:5}
#ts button{background:none;color:var(--hl);padding:0 0 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}
.cal small{font-size:12px}
.cal b{font-weight:500;padding:9px 0;border-radius:12px;position:relative}
.cal b.tdy{background:var(--ac2);color:var(--ac)}
.cal b.sel{background:var(--ac);color:#fff}
.cal u{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--hl)}
select{font:inherit;font-size:16px;border:2px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:14px;padding:10px}
</style>
</head>
<body>
<main></main>
<nav></nav><div id=ts></div><div id=lk></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let S={todos:[],habits:[],shop:[],exp:[],note:'',water:{},mood:{},cd:[],hist:{},focus:{}},tab='heute',T=day();
try{Object.assign(S,JSON.parse(localStorage.getItem('alltag1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('alltag1',JSON.stringify(S))}catch(e){}};
const streak=h=>{let n=0,d=new Date();if(!h.days.includes(day(d)))d.setDate(d.getDate()-1);while(h.days.includes(day(d))){n++;d.setDate(d.getDate()-1)}return n};
let tm={end:0,left:1500,run:0,iv:0};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function ad(l,id,x){const el=$('#'+id),v=el.value.trim();if(!v)return;S[l].unshift(Object.assign({id:uid(),t:v},x));save();render();const n=$('#'+id);n&&n.focus()}
function tg(l,id){const i=S[l].find(x=>x.id==id);if(l=='todos'&&!i.done){S.dn.push(T);if(i.rep){const b=new Date((i.due&&i.due>T?i.due:T)+'T00:00');i.rep==30?b.setMonth(b.getMonth()+1):b.setDate(b.getDate()+i.rep);i.due=day(b);save();render();return}}i.done=!i.done;save();render()}
function rm(l,id){const i=S[l].findIndex(x=>x.id==id);if(i<0)return;UN={l,i,x:S[l][i]};S[l].splice(i,1);save();render();toast('Gelöscht',1)}
function st(id){const i=S.todos.find(x=>x.id==id);i.p=i.p?0:1;save();render()}
function hb(id){const h=S.habits.find(x=>x.id==id);h.days=h.days.includes(T)?h.days.filter(d=>d!=T):[...h.days,T];save();render()}
function wt(n){S.water[T]=Math.max(0,(S.water[T]||0)+n);save();render()}
function md(i){S.mood[T]=i;save();render()}
function cl(){S.shop.filter(x=>x.done).forEach(x=>{if(!S.hs.includes(x.t))S.hs.unshift(x.t)});S.hs=S.hs.slice(0,12);S.shop=S.shop.filter(x=>!x.done);save();render()}
function ae(){const a=parseFloat($('#ea').value.replace(',','.'));if(!(a>0))return;S.exp.unshift({id:uid(),a,t:$('#el').value.trim()||'Ausgabe',d:T,c:CAT});save();render()}
function ts(m){tm.left=m*60;tm.run=0;clearInterval(tm.iv);tick()}
function tgo(){if(tm.run){tm.run=0;clearInterval(tm.iv)}else if(tm.left){tm.run=1;beep(0);tm.end=Date.now()+tm.left*1000;tm.iv=setInterval(tick,500)}tick()}
function tick(){if(tm.run){tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));if(!tm.left){tm.run=0;clearInterval(tm.iv);try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}beep(3);S.sess[T]=(S.sess[T]||0)+1;save()}}const e=$('#tt'),b=$('#tb');if(e)e.textContent=tm.left||tm.run?fmt(tm.left):'Fertig ✓';if(b)b.textContent=tm.run?'Pause':'Start'}
function dec(){const v=$('#di').value.split(',').map(s=>s.trim()).filter(Boolean),o=v.length>1?v:['Kopf','Zahl'];$('#dr').textContent=o[Math.floor(Math.random()*o.length)]}
function tip(){const b=parseFloat($('#bl').value.replace(',','.'))||0,pv=$('#tp').value,p=pv===''?10:+pv,n=Math.max(1,+$('#tn').value||1),t=b*(1+p/100);$('#tr').textContent=b?eur(t)+' gesamt, '+eur(t/n)+' pro Person':'Rechnung eintragen – Trinkgeld und Personen sind optional.'}
const CATS=['🍽️','🛒','🚗','🏠','🎉','🛍️','💊'];let CAT=CATS[0],bi=0;
const dl=d=>Math.round((new Date(d+'T00:00')-new Date(T+'T00:00'))/864e5);
function fc(v){S.focus[T]=v;save()}
function ac(c){CAT=c;render()}
function qa(t){S.shop.unshift({id:uid(),t});save();render()}
function acd(){const t=$('#ct').value.trim(),d=$('#cdd').value;if(!t||!d)return;S.cd.push({id:uid(),t,d});S.cd.sort((a,b)=>a.d.localeCompare(b.d));save();render()}
function un(){const v=parseFloat($('#uv').value.replace(',','.'));$('#ur').innerHTML=isNaN(v)?'Zahl eingeben':`${v} mi = ${(v*1.60934).toFixed(2)} km<br>${v} km = ${(v/1.60934).toFixed(2)} mi<br>${v} lb = ${(v*.453592).toFixed(2)} kg<br>${v} kg = ${(v/.453592).toFixed(2)} lb<br>${v} °C = ${(v*9/5+32).toFixed(1)} °F<br>${v} °F = ${((v-32)*5/9).toFixed(1)} °C`}
function br(){const b=$('#bk');if(bi){clearInterval(bi);bi=0;b.textContent='Start';b.style.transform='';return}let k=0;const st=[['Einatmen',1.5],['Halten',1.5],['Ausatmen',1],['Halten',1]];const run=()=>{const s=st[k%4],e=$('#bk');if(!e)return;e.textContent=s[0];e.style.transform='scale('+s[1]+')';k++};run();bi=setInterval(run,4000)}
function ex(){S.bk=T;save();const t=JSON.stringify(S);if(navigator.share){navigator.share({text:t}).catch(()=>{});return}(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Sicherung kopiert. Füge sie in eine Nachricht an dich selbst ein.'),()=>{$('#bx').value=t;$('#bx').select()})}
function im(){try{const o=JSON.parse($('#bx').value);if(!o||!Array.isArray(o.todos))throw 0;S=Object.assign({todos:[],habits:[],shop:[],exp:[],note:'',water:{},mood:{},cd:[],hist:{},focus:{}},o);save();render();alert('Wiederhergestellt.')}catch(e){alert('Das ist keine gültige Sicherung.')}}
function sl(n){S.sleep[T]=Math.max(0,Math.min(14,(S.sleep[T]||0)+n));save();render()}
function gr(v){S.grat[T]=v;save()}
function mp(i,v){S.meal[i]=v;save()}
function bd(v){S.bud=parseFloat(String(v).replace(',','.'))||0;save()}
function mw(){const v=parseFloat($('#mv').value.replace(',','.')),r=+$('#mr').value;$('#mo').innerHTML=isNaN(v)?'Betrag eingeben':`Netto ${eur(v)} = Brutto ${eur(v*(1+r/100))}<br>Brutto ${eur(v)} = Netto ${eur(v/(1+r/100))}`}
function pw(){const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!?#$%',a=new Uint32Array(16);crypto.getRandomValues(a);const p=[...a].map(x=>c[x%c.length]).join('');$('#pr').textContent=p;try{navigator.clipboard.writeText(p)}catch(e){}}
function th(){S.theme=(S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}
const QT=['Kleine Schritte zählen mehr als große Pläne.','Erst atmen, dann entscheiden.','Heute reicht es, den nächsten Schritt zu tun.','Fortschritt ist leise.','Pausen gehören zur Arbeit.','Eine erledigte Kleinigkeit macht den Kopf frei.','Gut genug ist oft genau richtig.','Anfangen ist die halbe Miete.'];let FL='alle',AU;
function beep(n){try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();AU.resume();for(let k=0;k<n;k++){const o=AU.createOscillator(),g=AU.createGain();o.connect(g);g.connect(AU.destination);o.frequency.value=880;g.gain.value=.2;o.start(AU.currentTime+k*.4);o.stop(AU.currentTime+k*.4+.2)}}catch(e){}}
function pv(){['Schlüssel','Sonnenbrille','Kopfhörer','Geldbörse','Kleidung','Zahnbürste','Ladegerät','Ausweis'].forEach(t=>S.pack.unshift({id:uid(),t}));save();render()}
function pr0(){S.pack.forEach(x=>x.done=false);save();render()}
function ct0(){S.todos=S.todos.filter(x=>!x.done);save();render()}
function qh(t){S.habits.unshift({id:uid(),t,days:[]});save();render()}
let UN=null,UT;
function toast(m,f){const e=$('#ts');e.innerHTML=m+(f?' <button onclick="uu()">Rückgängig</button>':'');e.style.display='block';clearTimeout(UT);UT=setTimeout(()=>e.style.display='none',4500)}
function uu(){if(UN){S[UN.l].splice(UN.i,0,UN.x);UN=null;save();render();$('#ts').style.display='none'}}
function ed(l,id){const i=S[l].find(x=>x.id==id),v=prompt('Text ändern',i.t);if(v&&v.trim()){i.t=v.trim();save();render()}}
const cy=c=>{let d=c.d;if(/geburtstag|jahrestag/i.test(c.t))while(dl(d)<0)d=(+d.slice(0,4)+1)+d.slice(4);return d};
function sh(){const t='Einkauf:\n'+S.shop.filter(x=>!x.done).map(x=>'• '+x.t).join('\n');if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);toast('Liste kopiert')}catch(e){}}}
function aa(){const a=parseFloat($('#aa').value.replace(',','.')),t=$('#an').value.trim();if(!t||!(a>0))return;S.abo.unshift({id:uid(),t,a});save();render()}
function rb(){const v=parseFloat($('#rv').value.replace(',','.')),p=parseFloat($('#rp2').value.replace(',','.'))||0;$('#ro').textContent=isNaN(v)?'Preis und Rabatt eingeben':`Neuer Preis ${eur(v*(1-p/100))}, du sparst ${eur(v*p/100)}`}
function rs(){if(confirm('Wirklich alle Daten löschen?')){S={todos:[],habits:[],shop:[],exp:[],note:'',water:{},mood:{},cd:[],hist:{},focus:{}};save();render()}}
let sw={a:0,t:0,run:0,iv:0};
function sws(){const e=$('#sw');if(!e)return;const ms=sw.a+(sw.run?Date.now()-sw.t:0);e.textContent=fmt(Math.floor(ms/1000))+','+Math.floor(ms%1000/100);const b=$('#sb');if(b)b.textContent=sw.run?'Stopp':'Start'}
function swg(){if(sw.run){sw.run=0;clearInterval(sw.iv);sw.a+=Date.now()-sw.t}else{sw.run=1;sw.t=Date.now();sw.iv=setInterval(sws,100)}sws()}
function swr(){sw.a=0;sw.run=0;clearInterval(sw.iv);sws()}
function ag(){const t=$('#gn').value.trim(),z=parseFloat($('#gz').value.replace(',','.'));if(!t||!(z>0))return;S.goals.push({id:uid(),t,cur:0,z});save();render()}
function gp(id){const g=S.goals.find(x=>x.id==id),v=parseFloat((prompt('Wie viel dazu? (Minus zum Abziehen)','1')||'').replace(',','.'));if(isNaN(v))return;g.cur=Math.max(0,g.cur+v);save();render()}
function az(){const a=$('#a1').value,b=$('#a2').value,p=+$('#a3').value||0;if(!a||!b){$('#ao').textContent='Beginn und Ende wählen';return}let m=(+b.slice(0,2)*60+ +b.slice(3))-(+a.slice(0,2)*60+ +a.slice(3))-p;if(m<0)m+=1440;$('#ao').textContent=`${Math.floor(m/60)} Std. ${m%60} Min. (${(m/60).toFixed(2).replace('.',',')} Std.)`}
function sr(){const q=$('#sq').value.trim().toLowerCase(),o=[];if(q.length>1){[['Aufgabe','todos'],['Einkauf','shop'],['Merkliste','idea'],['Packliste','pack'],['Routine','habits'],['Abo','abo'],['Ziel','goals'],['Notizbuch','nts']].forEach(([n,l])=>S[l].forEach(x=>{if(x.t.toLowerCase().includes(q))o.push(n+': '+x.t)}));S.exp.forEach(x=>{if(x.t.toLowerCase().includes(q))o.push('Ausgabe: '+x.t+' ('+eur(x.a)+')')});S.nts.forEach(x=>{if(x.b.toLowerCase().includes(q))o.push('Notizbuch: '+x.t)});S.note.split('\n').forEach(l=>{if(l.toLowerCase().includes(q))o.push('Notiz: '+l)})}$('#so').innerHTML=q.length<2?'Mindestens zwei Buchstaben eingeben':o.length?o.slice(0,12).map(x=>'<div class=it><span>'+esc(x)+'</span></div>').join(''):'Nichts gefunden'}
const CM={'Fokus-Timer':'zeit','Stoppuhr':'zeit','Arbeitszeit':'zeit','Atem-Pause':'zeit','Countdowns':'zeit','Ausgaben':'geld','Abos und Fixkosten':'geld','Ziele':'geld','Rabatt':'geld','Fahrtkosten':'geld','Sparrechner':'geld','Mehrwertsteuer':'geld','Trinkgeld und Teilen':'geld','Kalender':'orga','Merkliste':'orga','Packliste':'orga','Notizen':'orga','Entscheidungshilfe':'tools','Karteikarten':'tools','Notizbuch':'orga','Zähler':'tools','Wehen-Tracker':'wehen','Kindsbewegungen':'wehen','Geburtstermin':'wehen','Umrechner':'tools','Passwort-Generator':'tools','Darstellung':'tools','Sicherung':'tools'};let MF='alle',CO=0,SD=null;
function mf(){if(MF=='alle')return;document.querySelectorAll('main .pn').forEach(p=>{const h=p.querySelector('h2'),c=h&&CM[h.textContent];if((c&&c!=MF)||(MF=='wehen'&&h&&h.textContent=='Suche'))p.style.display='none'})}
function cm(n){CO+=n;SD=null;render()}
function cal(){const b=new Date(new Date().getFullYear(),new Date().getMonth()+CO,1),y=b.getFullYear(),m=b.getMonth(),n=new Date(y,m+1,0).getDate(),p=x=>String(x).padStart(2,'0'),it=ds=>[...S.todos.filter(x=>!x.done&&x.due==ds).map(x=>'☐ '+x.t),...S.cd.filter(c=>cy(c)==ds).map(c=>'★ '+c.t)];let g=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<small>${x}</small>`).join('')+'<i></i>'.repeat((b.getDay()+6)%7);for(let k=1;k<=n;k++){const ds=y+'-'+p(m+1)+'-'+p(k);g+=`<b class="${ds==T?'tdy':''} ${ds==SD?'sel':''}" onclick="SD='${ds}';render()">${k}${it(ds).length?'<u></u>':''}</b>`}return `<div class=pn><h2>Kalender</h2><div class=sp><button class=g onclick="cm(-1)">‹</button><b>${b.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class=g onclick="cm(1)">›</button></div><div class=cal>${g}</div>${SD?it(SD).map(x=>`<div class=it><span>${esc(x)}</span></div>`).join('')||'<p class=sub style="margin:10px 0 0">Nichts an diesem Tag.</p>':''}${SD?'<div class=row style="margin-top:10px"><input id=ck placeholder="Aufgabe für diesen Tag …"><button onclick="ak()">+</button></div>':''}</div>`}

habits(){return `<h1>Routinen</h1><p class=sub>Hak jeden Tag ab und halte die Serie am Leben. Tippe auf einen Punkt, um einen vergangenen Tag nachzutragen.</p>${add('hi','habits','z. B. 10 Minuten lesen',',{days:[]}')}<div class=chips>${['Spazieren','Lesen','Dehnen','Meditieren','Früh aufstehen','Tagebuch'].filter(n=>!S.habits.some(h=>h.t==n)).map(n=>`<button onclick="qh(this.dataset.n)" data-n="${n}">+ ${n}</button>`).join('')}</div>${S.habits.map(h=>{const on=h.days.includes(T);return `<div class=pn><div class="it ${on?'done':''}" style="border:0;padding:0"><button class=chk onclick="hb('${h.id}')">${on?'✓':''}</button><span onclick="ed('habits','${h.id}')">${esc(h.t)}</span><b>${FIRE}${streak(h)}</b><small>${Math.round(h.days.filter(d=>d>day(new Date(Date.now()-2592e6))).length/30*100)}%</small><button class=x onclick="rm('habits','${h.id}')">×</button></div><div class=dots>${[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return `<u class="${h.days.includes(day(d))?'on':''}" onclick="hx('${h.id}','${day(d)}')"></u>`}).join('')}</div></div>`}).join('')||'<p class=sub>Noch keine Routinen. Leg oben die erste an.</p>'}${S.habits.length?`<div class=pn><h2>Verlauf der letzten 12 Wochen</h2><div class=hm>${(()=>{const s=new Date(),sd=(s.getDay()+6)%7;s.setDate(s.getDate()-sd-77);let h='';for(let i=0;i<84;i++){const d=new Date(s);d.setDate(s.getDate()+i);const k=day(d),r=k>T?-1:S.habits.filter(x=>x.days.includes(k)).length/S.habits.length;h+=`<u class="${r<0?'f':r==0?'':r<.5?'l1':r<1?'l2':'l3'}"></u>`}return h})()}</div><p class=sub style="margin:10px 0 0;font-size:13px">Je dunkler, desto mehr Routinen hast du an dem Tag geschafft.</p></div>`:''}`},
shop(){return `<h1>Einkauf</h1><p class=sub>Abgehakt heißt im Wagen. Mit Preis am Ende (Milch 1,29) bekommst du eine Summe.</p>${add('si','shop','Was fehlt?')}<div class=chips>${[...S.hs,'Milch','Brot','Eier','Obst','Gemüse','Kaffee','Käse','Nudeln'].filter((n,i,a)=>a.indexOf(n)==i&&!S.shop.some(x=>x.t==n&&!x.done)).slice(0,14).map(n=>`<button onclick="qa(this.dataset.n)" data-n="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div><div class=pn>${S.shop.map(x=>`<div class="it ${x.done?'done':''}"><button class=chk onclick="tg('shop','${x.id}')">${x.done?'✓':''}</button><span onclick="ed('shop','${x.id}')">${esc(x.t)}</span><button class=x onclick="rm('shop','${x.id}')">×</button></div>`).join('')||'<p class=sub>Die Liste ist leer.</p>'}</div>${(()=>{const s=S.shop.filter(x=>!x.done).reduce((a,x)=>{const m=x.t.match(/(\d+[.,]\d{1,2})\s*€?$/);return a+(m?parseFloat(m[1].replace(',','.')):0)},0);return s?`<p class=sub>Geschätzt: ${eur(s)}</p>`:''})()}${S.shop.some(x=>x.done)?'<button class=g onclick="cl()">Abgehakte entfernen</button>':''}${S.shop.some(x=>!x.done)?'<button onclick="sh()" style="margin-left:8px">Liste teilen</button>':''}<div class=pn style="margin-top:14px"><h2>Essensplan der Woche</h2>${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<div class=it><b style="width:28px">${d}</b><input value="${esc(S.meal[i]||'')}" placeholder="Was gibt es?" oninput="mp(${i},this.value)"></div>`).join('')}</div>`},
mehr(){const m=T.slice(0,7),te=S.exp.slice(0,8),pm=S.exp.filter(e=>e.d.slice(0,7)==day(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)).slice(0,7)).reduce((a,e)=>a+e.a,0),ms=S.exp.filter(e=>e.d.slice(0,7)===m).reduce((a,e)=>a+e.a,0),bc=CATS.map(c=>[c,S.exp.filter(e=>e.d.slice(0,7)===m&&e.c==c).reduce((a,e)=>a+e.a,0)]).filter(x=>x[1]>0);
 return `<h1>Werkzeuge</h1><p class=sub>Kleine Helfer für unterwegs.</p>

 <div class=pn><h2>Suche</h2><input id=sq placeholder="In allem suchen …" oninput="sr()"><div id=so class=sub style="margin:10px 0 0">Mindestens zwei Buchstaben eingeben</div></div>
 <div class=pn><h2>Fokus-Timer</h2><div class=big id=tt>${fmt(tm.left)}</div><p class=sub style="text-align:center;margin:0">${S.sess[T]||0} Runden heute</p><div class=row style="margin-top:10px"><button class=g onclick="ts(5)">5 min</button><button class=g onclick="ts(15)">15 min</button><button class=g onclick="ts(25)">25 min</button><button id=tb style="flex:1" onclick="tgo()">Start</button></div><div class=row style="margin-top:8px"><input id=tcm inputmode=numeric placeholder="Eigene Minuten"><button class=g onclick="ts(+$('#tcm').value||25)">Setzen</button></div></div>
 <div class=pn><h2>Ausgaben</h2><p class=sub style="margin-bottom:10px">Diesen Monat: ${eur(ms)}${S.bud?' von '+eur(S.bud):''}${pm?', Vormonat '+eur(pm):''}</p>${S.bud?`<div class="pb ${ms>S.bud?'o':''}"><i style="width:${Math.min(100,ms/S.bud*100)}%"></i></div>`:''}<input inputmode=decimal placeholder="Monatsbudget festlegen (optional)" value="${S.bud||''}" onchange="bd(this.value);render()" style="margin-bottom:10px"><div class=chips>${CATS.map(c=>`<button class="${c==CAT?'on':''}" onclick="ac('${c}')">${cn(c)}</button>`).join('')}</div><div class=row><input id=ea inputmode=decimal placeholder="Betrag" style="width:34%"><input id=el placeholder="Wofür?"><button onclick="ae()">+</button></div>${te.map(e=>`<div class=it><span>${e.c?cn(e.c)+': ':''}${esc(e.t)}${e.d!=T?` <small>${e.d.slice(8)}.${e.d.slice(5,7)}.</small>`:''}</span><b>${eur(e.a)}</b><button class=x onclick="rm('exp','${e.id}')">×</button></div>`).join('')}${bc.length?bc.map(x=>`<div class=sp style="padding:4px 0"><span>${cn(x[0])}</span><div class=pb style="flex:1;margin:0 10px"><i style="width:${x[1]/ms*100}%"></i></div><b>${eur(x[1])}</b></div>`).join(''):''}${(()=>{const ds=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return day(d)}),v=ds.map(d=>S.exp.filter(e=>e.d==d).reduce((a,e)=>a+e.a,0)),mx=Math.max(...v,1);return v.some(x=>x>0)?`<p class=sub style="margin:12px 0 0">Letzte 14 Tage</p><div class=wk style="height:70px">${v.map(x=>`<div><i style="height:${x/mx*54}px;${x?'':'opacity:.25'}"></i></div>`).join('')}</div>`:''})()}</div>
 <div class=pn><h2>Karteikarten</h2><div class=row><input id=kq placeholder="Vorderseite"><input id=ka placeholder="Rückseite"><button onclick="kn()">+</button></div>${S.cards.length?`<div class=big style="font-size:24px;margin:12px 0" onclick="KS=1;render()">${KC?esc(KS?KC.a:KC.q):'Tippe auf „Karte ziehen“'}</div><div class=row><button onclick="kd()" style="flex:1">Karte ziehen</button><button class=g onclick="KS=1;render()">Umdrehen</button>${KC?`<button class=g onclick="const i=KC.id;KC=null;rm('cards',i)">Löschen</button>`:''}</div><p class=sub style="margin:10px 0 0">${S.cards.length} Karten</p>`:'<p class=sub style="margin:10px 0 0">Lege Vokabeln oder Merksätze an.</p>'}</div>
 <div class=pn><h2>Entscheidungshilfe</h2><div class=row><input id=di placeholder="Pizza, Sushi, Burger – leer = Münze"><button onclick="dec()">Los</button><button class=g onclick="$('#dr').textContent=1+Math.floor(Math.random()*6)">Würfel</button></div><div class=big id=dr style="margin-top:8px;font-size:30px">–</div></div>
 <div class=pn><h2>Trinkgeld und Teilen</h2><div class=row><input id=bl inputmode=decimal placeholder="Rechnung" oninput="tip()"><input id=tp inputmode=numeric placeholder="% (10)" style="width:34%" oninput="tip()"><input id=tn inputmode=numeric placeholder="Pers." style="width:28%" oninput="tip()"></div><p id=tr class=sub style="margin:10px 0 0">Rechnung eintragen – Trinkgeld und Personen sind optional.</p></div>
 <div class=pn><h2>Countdowns</h2><div class=row><input id=ct placeholder="Urlaub, Geburtstag, Seit Umzug …"><input id=cdd type=date style="width:auto"><button onclick="acd()">+</button></div>${S.cd.map(c=>`<div class=it><span>${esc(c.t)}</span><b>${(()=>{const n=dl(cy(c));return n<0?(/^seit/i.test(c.t)?'seit '+(-n)+' Tagen':'vorbei'):n==0?'heute':n==1?'morgen':'in '+n+' Tagen'})()}</b><button class=x onclick="rm('cd','${c.id}')">×</button></div>`).join('')}</div>
 <div class=pn><h2>Atem-Pause</h2><p class=sub style="margin:0">Box-Atmung: je vier Sekunden ein, halten, aus, halten.</p><div class=bk id=bk role=button onclick="br()">Start</div></div>
 <div class=pn><h2>Umrechner</h2><input id=uv inputmode=decimal placeholder="Zahl eingeben" oninput="un()"><p id=ur class=sub style="margin:10px 0 0">Meilen, Kilo, Grad Celsius – in beide Richtungen.</p></div>
 <div class=pn><h2>Notizbuch</h2><div class=row><input id=nti placeholder="Titel der Notiz"><button onclick="nn()">+</button></div>${S.nts.map(n=>`<div class=it style="flex-wrap:wrap"><span onclick="NO=NO=='${n.id}'?null:'${n.id}';render()">${esc(n.t)}</span><small>${n.b.length} Zeichen</small><button class=x onclick="rm('nts','${n.id}')">×</button>${NO==n.id?`<textarea rows=6 style="width:100%;margin-top:8px" oninput="nb('${n.id}',this.value)">${esc(n.b)}</textarea>`:''}</div>`).join('')}</div>
 <div class=pn><h2>Notizen</h2><textarea rows=6 placeholder="Gedanken, Ideen, Merkzettel …" oninput="S.note=this.value;save()">${esc(S.note)}</textarea></div>
 ${whp()}
 ${kmp()}
 ${etp()}
 ${cal()}
 <div class=pn><h2>Merkliste</h2><p class=sub style="margin:0 0 10px">Ideen, Geschenke, Filme, Links – alles, was du nicht vergessen willst.</p>${add('mi','idea','Neue Idee …')}${S.idea.map(x=>`<div class=it><span onclick="ed('idea','${x.id}')">${esc(x.t)}</span><button class=x onclick="rm('idea','${x.id}')">×</button></div>`).join('')}</div>
 <div class=pn><h2>Abos und Fixkosten</h2><div class=row><input id=an placeholder="Name"><input id=aa inputmode=decimal placeholder="€ / Monat" style="width:32%"><button onclick="aa()">+</button></div>${S.abo.map(x=>`<div class=it><span onclick="ed('abo','${x.id}')">${esc(x.t)}</span><b>${eur(x.a)}</b><button class=x onclick="rm('abo','${x.id}')">×</button></div>`).join('')}${S.abo.length?`<p class=sub style="margin:10px 0 0">Pro Monat ${eur(S.abo.reduce((a,x)=>a+x.a,0))}, pro Jahr ${eur(S.abo.reduce((a,x)=>a+x.a,0)*12)}</p>`:''}</div>
 <div class=pn><h2>Ziele</h2><div class=row><input id=gn placeholder="z. B. 500 € sparen"><input id=gz inputmode=decimal placeholder="Ziel" style="width:26%"><button onclick="ag()">+</button></div>${S.goals.map(x=>`<div class=it style="flex-wrap:wrap"><span onclick="ed('goals','${x.id}')">${esc(x.t)}</span><b>${+x.cur.toFixed(2)} / ${x.z}</b><button class=g onclick="gp('${x.id}')" style="padding:6px 12px">+</button><button class=x onclick="rm('goals','${x.id}')">×</button><div class=pb style="width:100%;margin:0"><i style="width:${Math.min(100,x.cur/x.z*100)}%"></i></div></div>`).join('')}</div>
 <div class=pn><h2>Stoppuhr</h2><div class=big id=sw>00:00,0</div><div class=row style="margin-top:8px"><button class=g onclick="swr()">Zurücksetzen</button><button id=sb style="flex:1" onclick="swg()">Start</button></div></div>
 <div class=pn><h2>Arbeitszeit</h2><div class=row><input id=a1 type=time oninput="az()"><input id=a2 type=time oninput="az()"><input id=a3 inputmode=numeric placeholder="Pause min" style="width:34%" oninput="az()"></div><p id=ao class=sub style="margin:10px 0 0">Beginn und Ende wählen</p></div>
 <div class=pn><h2>Zähler</h2>${add('zi','cnt','Name, z. B. Kaffee',',{n:0}')}${S.cnt.map(c=>`<div class=it><span onclick="ed('cnt','${c.id}')">${esc(c.t)}</span><b>${c.n}</b><button class=g onclick="zc('${c.id}',-1)" style="padding:6px 12px">−</button><button onclick="zc('${c.id}',1)" style="padding:6px 12px">+</button><button class=x onclick="rm('cnt','${c.id}')">×</button></div>`).join('')}</div>
 <div class=pn><h2>Fahrtkosten</h2><div class=row><input id=fkm inputmode=decimal placeholder="km" oninput="fk()"><input id=fvv inputmode=decimal placeholder="l/100 km" oninput="fk()"><input id=fpp inputmode=decimal placeholder="€/Liter" oninput="fk()"></div><p id=fo class=sub style="margin:10px 0 0">Strecke, Verbrauch und Preis eingeben</p></div>
 <div class=pn><h2>Sparrechner</h2><div class=row><input id=srr inputmode=decimal placeholder="€ / Monat" oninput="sp2()"><input id=szz inputmode=decimal placeholder="% Zins" oninput="sp2()"><input id=sjj inputmode=numeric placeholder="Jahre" oninput="sp2()"></div><p id=sso class=sub style="margin:10px 0 0">Rate und Jahre eingeben</p><p class=sub style="margin:6px 0 0;font-size:13px">Nur eine Beispielrechnung, ohne Steuern und Gebühren.</p></div>

 <div class=pn><h2>Packliste</h2>${add('pi','pack','Was muss mit?')}<div class=chips><button onclick="pv()">+ Reise-Vorlage</button><button onclick="pk()">+ Kliniktasche</button>${S.pack.some(x=>x.done)?'<button onclick="pr0()">Haken zurücksetzen</button>':''}</div>${S.pack.map(x=>`<div class="it ${x.done?'done':''}"><button class=chk onclick="tg('pack','${x.id}')">${x.done?'✓':''}</button><span onclick="ed('pack','${x.id}')">${esc(x.t)}</span><button class=x onclick="rm('pack','${x.id}')">×</button></div>`).join('')}</div>
 <div class=pn><h2>Mehrwertsteuer</h2><div class=row><input id=mv inputmode=decimal placeholder="Betrag" oninput="mw()"><select id=mr onchange="mw()"><option>19</option><option>7</option></select><span>%</span></div><p id=mo class=sub style="margin:10px 0 0">Netto und Brutto in beide Richtungen.</p></div>

 <div class=pn><h2>Sicherung</h2><p class=sub style="margin-bottom:10px">Deine Daten liegen nur in diesem Browser. Kopiere sie ab und zu weg.</p><textarea id=bx rows=2 placeholder="Zum Wiederherstellen: Sicherung hier einfügen"></textarea><div class=row style="margin-top:8px;flex-wrap:wrap"><button class=g onclick="ex()">Sicherung teilen</button><button class=g onclick="im()">Wiederherstellen</button><button class=g onclick="rs()">Alles löschen</button></div></div>
 <p class=sub>Tipp: In Safari auf „Teilen“ und dann „Zum Home-Bildschirm“ tippen, dann startet Alltag im Vollbild. Deine Daten bleiben auf diesem Gerät.</p>`}
